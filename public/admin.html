<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Sir Mahee Admin</title>

<link rel="stylesheet" href="/style.css">

<style>
:root{
  --bg:#06111d;
  --text:#eef6ff;
  --muted:#a9b8ca;
  --line:rgba(255,255,255,.18);
  --success:#71e6a8;
  --danger:#ff7373;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
}

body{
  background:
    radial-gradient(circle at 12% 12%,rgba(0,255,170,.22),transparent 30%),
    radial-gradient(circle at 88% 8%,rgba(65,125,255,.27),transparent 32%),
    radial-gradient(circle at 50% 90%,rgba(120,70,255,.18),transparent 35%),
    var(--bg);
  background-attachment:fixed;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.05),
    transparent 35%,
    rgba(255,255,255,.025)
  );
}

/* NAVBAR */

nav{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:15px 22px;

  background:rgba(5,15,28,.55);
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
}

nav b{
  font-size:15px;
}

nav a{
  color:#d8e9fb;
  text-decoration:none;
  font-size:14px;
}

/* MAIN */

.admin{
  max-width:1100px;
  margin:0 auto;
  padding:42px 18px 70px;
}

/* LIQUID GLASS */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.055)
    );

  border:1px solid var(--line);

  box-shadow:
    0 20px 55px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.10);

  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
}

.panel{
  border-radius:24px;
  padding:26px;
}

#login{
  max-width:540px;
  margin:7vh auto;
}

/* TEXT */

h1{
  margin:0 0 18px;
  font-size:28px;
}

h2{
  margin:0 0 18px;
  font-size:20px;
}

p{
  color:var(--muted);
}

/* INPUTS */

input,
select,
textarea{
  width:100%;

  margin-top:8px;
  padding:13px 14px;

  border-radius:13px;

  color:var(--text);
  background:rgba(0,0,0,.18);

  border:1px solid rgba(255,255,255,.16);

  outline:none;

  font:inherit;
}

input:focus,
select:focus,
textarea:focus{
  border-color:rgba(118,199,255,.75);

  box-shadow:
    0 0 0 3px rgba(118,199,255,.12);
}

textarea{
  min-height:105px;
  resize:vertical;
}

label{
  display:block;
  color:#dce9f6;
  font-size:14px;
  margin-bottom:15px;
}

/* BUTTONS */

button{
  border:0;
  border-radius:12px;

  padding:11px 18px;

  color:#06111d;
  background:#dff3ff;

  font-weight:700;
  cursor:pointer;

  transition:
    .18s transform,
    .18s opacity;
}

button:hover{
  transform:translateY(-1px);
  opacity:.92;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.btn{
  background:rgba(255,255,255,.14);
  color:#eef7ff;

  border:1px solid var(--line);
}

.danger{
  background:rgba(255,75,75,.16);
  color:#ffd9d9;

  border:1px solid rgba(255,100,100,.28);
}

/* LAYOUT */

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 18px;
}

.status{
  min-height:22px;
  margin:12px 0 0;
  font-size:14px;
}

.ok{
  color:var(--success);
}

.err{
  color:#ffaaa9;
}

.hidden{
  display:none!important;
}

/* MATERIALS */

.items{
  display:grid;
  gap:12px;
}

.item{
  display:grid;

  grid-template-columns:1fr auto;

  gap:8px 14px;

  padding:17px;

  border-radius:17px;
}

.item .meta{
  color:var(--muted);
  font-size:13px;

  grid-column:1/2;
}

.item .actions{
  grid-column:2;
  grid-row:1/3;

  display:flex;
  align-items:center;
  gap:8px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.loading{
  opacity:.7;
}

.badge{
  display:inline-block;

  padding:5px 9px;

  border-radius:999px;

  background:rgba(255,255,255,.09);

  border:1px solid var(--line);

  font-size:12px;
}

/* MOBILE */

@media(max-width:700px){

  .two{
    grid-template-columns:1fr;
  }

  .panel{
    padding:19px;
    border-radius:20px;
  }

  .admin{
    padding:25px 12px 50px;
  }

  .row{
    align-items:flex-start;
  }

  .item{
    grid-template-columns:1fr;
  }

  .item .actions{
    grid-column:1;
    grid-row:auto;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>


<body>

<nav>

  <b>🔐 Sir Mahee Admin</b>

  <a href="/">
    Student Website ↗
  </a>

</nav>


<main class="admin">

<!-- ================= LOGIN ================= -->

<section id="login" class="glass panel">

  <h1>
    Admin Login
  </h1>

  <p>
    Sign in to manage Sir Mahee study materials.
  </p>


  <form id="loginForm" autocomplete="on">

    <label>
      Email

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="Admin email"
        required
      >

    </label>


    <label>
      Password

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Admin password"
        required
      >

    </label>


    <button
      id="loginBtn"
      type="submit"
    >
      Login
    </button>


    <div
      id="loginMsg"
      class="status"
    ></div>

  </form>

</section>



<!-- ================= DASHBOARD ================= -->

<section
  id="dash"
  class="hidden"
>


<!-- CONTENT MANAGER -->

<div class="glass panel">

  <div class="row">

    <div>

      <h1>
        📤 Content Manager
      </h1>

      <p>
        Upload and manage your study material.
      </p>

    </div>


    <button
      class="btn"
      id="logoutBtn"
      type="button"
    >
      Logout
    </button>

  </div>



  <!-- UPLOAD FORM -->

  <form
    id="materialForm"
    enctype="multipart/form-data"
  >

    <div class="two">


      <label>
        Title

        <input
          name="title"
          required
          placeholder="Tenses — Complete Notes"
        >

      </label>



      <label>
        Class

        <select name="className">

          <option>
            All Classes
          </option>

          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option>8</option>
          <option>9</option>
          <option>10</option>

        </select>

      </label>



      <label>
        Subject

        <select name="subject">

          <option>English</option>
          <option>Hindi</option>
          <option>Maths</option>
          <option>Science</option>
          <option>Social Science</option>
          <option>Rajasthan GK</option>
          <option>Competitive Exams</option>
          <option>Other</option>

        </select>

      </label>



      <label>
        Type

        <select name="type">

          <option>Notes</option>
          <option>PDF</option>
          <option>Worksheet</option>
          <option>Question Paper</option>
          <option>Video</option>
          <option>Audio</option>
          <option>Image</option>
          <option>Other</option>

        </select>

      </label>



      <label>
        Chapter

        <input
          name="chapter"
          placeholder="Grammar / Tenses"
        >

      </label>



      <label>
        Description

        <textarea
          name="description"
          placeholder="Short description"
        ></textarea>

      </label>


    </div>


    <label>

      File

      <input
        name="file"
        type="file"
        required
      >

    </label>


    <button
      id="uploadBtn"
      type="submit"
    >
      ⬆️ Upload Material
    </button>


    <div
      id="upmsg"
      class="status"
    ></div>

  </form>

</div>



<!-- UPLOADED MATERIALS -->

<div
  class="glass panel"
  style="margin-top:18px"
>

  <div class="row">

    <h2>
      📚 Uploaded Materials
    </h2>

    <span
      id="count"
      class="badge"
    >
      0
    </span>

  </div>


  <div
    id="items"
    class="items"
  >

    <div class="empty">
      Loading...
    </div>

  </div>

</div>


</section>

</main>



<script>

/* =========================================
   BASIC HELPER
========================================= */

const $ = id => document.getElementById(id);



/* =========================================
   FETCH HELPER
========================================= */

async function jsonFetch(url, options = {}) {

  const response = await fetch(
    url,
    {
      credentials:"same-origin",
      ...options
    }
  );

  let data = {};

  try{

    data = await response.json();

  }catch(_){}

  return {
    response,
    data
  };
}



/* =========================================
   SESSION CHECK
========================================= */

async function checkSession(){

  try{

    const {
      response,
      data
    } = await jsonFetch("/api/me");


    if(
      response.ok &&
      data.loggedIn
    ){

      showDashboard();

      await loadMaterials();

    }else{

      showLogin();

    }

  }catch(err){

    showLogin();

    $("loginMsg").textContent =
      "Server से connection नहीं हो रहा।";

    $("loginMsg").className =
      "status err";

  }

}



/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  $("login")
    .classList
    .remove("hidden");

  $("dash")
    .classList
    .add("hidden");

}



/* =========================================
   SHOW DASHBOARD
========================================= */

function showDashboard(){

  $("login")
    .classList
    .add("hidden");

  $("dash")
    .classList
    .remove("hidden");

}



/* =========================================
   LOGIN
========================================= */

$("loginForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();


    const email =
      $("email").value.trim();

    const password =
      $("password").value;


    const btn =
      $("loginBtn");

    const msg =
      $("loginMsg");


    msg.textContent = "";


    if(
      !email ||
      !password
    ){

      msg.textContent =
        "Email और Password दोनों भरें।";

      msg.className =
        "status err";

      return;

    }


    btn.disabled = true;

    btn.textContent =
      "Logging in...";


    try{

      const {
        response,
        data
      } = await jsonFetch(
        "/api/login",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email,
              password
            })

        }
      );


      if(
        response.ok &&
        data.ok
      ){

        msg.textContent =
          "Login successful ✓";

        msg.className =
          "status ok";


        showDashboard();

        await loadMaterials();

      }else{

        msg.textContent =
          data.error ||
          "Invalid email or password.";

        msg.className =
          "status err";

      }


    }catch(err){

      msg.textContent =
        "Server connection failed: " +
        err.message;

      msg.className =
        "status err";

    }finally{

      btn.disabled = false;

      btn.textContent =
        "Login";

    }

  }
);



/* =========================================
   LOGOUT
========================================= */

$("logoutBtn").addEventListener(
  "click",
  async () => {

    try{

      await jsonFetch(
        "/api/logout",
        {
          method:"POST"
        }
      );

    }finally{

      showLogin();

      $("password").value = "";

    }

  }
);



/* =========================================
   UPLOAD MATERIAL
========================================= */

$("materialForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();


    const btn =
      $("uploadBtn");

    const msg =
      $("upmsg");


    btn.disabled = true;

    btn.textContent =
      "Uploading...";

    msg.textContent = "";


    try{

      const {
        response,
        data
      } = await jsonFetch(
        "/api/materials",
        {

          method:"POST",

          body:
            new FormData(
              $("materialForm")
            )

        }
      );


      if(response.ok){

        msg.textContent =
          "Material uploaded successfully ✓";

        msg.className =
          "status ok";


        $("materialForm").reset();

        await loadMaterials();

      }else{

        msg.textContent =
          data.error ||
          "Upload failed.";

        msg.className =
          "status err";

      }


    }catch(err){

      msg.textContent =
        "Upload error: " +
        err.message;

      msg.className =
        "status err";

    }finally{

      btn.disabled = false;

      btn.textContent =
        "⬆️ Upload Material";

    }

  }
);



/* =========================================
   LOAD MATERIALS
========================================= */

async function loadMaterials(){

  const box =
    $("items");


  box.classList.add(
    "loading"
  );


  try{

    const {
      response,
      data
    } = await jsonFetch(
      "/api/materials"
    );


    if(!response.ok){

      throw new Error(
        data.error ||
        "Could not load materials"
      );

    }


    $("count").textContent =
      Array.isArray(data)
        ? data.length
        : 0;


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      box.innerHTML =
        '<div class="empty">' +
        'No materials yet.' +
        '</div>';

      return;

    }


    box.innerHTML =
      data.map(x => {

        const title =
          esc(x.title);

        const subject =
          esc(x.subject);

        const cls =
          esc(x.class_name);

        const type =
          esc(x.type);

        const id =
          Number(x.id);

        const file =
          encodeURIComponent(
            x.stored_name || ""
          );


        return `

          <div class="item glass">

            <div>
              <b>
                ${title}
              </b>
            </div>


            <div class="meta">
              ${subject}
              • Class ${cls}
              • ${type}
            </div>


            <div class="actions">

              <a
                class="btn"
                style="
                  padding:9px 12px;
                  border-radius:10px;
                  text-decoration:none;
                  color:inherit
                "
                href="/uploads/${file}"
                target="_blank"
                rel="noopener"
              >
                Open
              </a>


              <button
                class="danger"
                type="button"
                onclick="deleteMaterial(${id})"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      }).join("");


  }catch(err){

    box.innerHTML =
      '<div class="empty">' +
      'Materials load नहीं हो सके: ' +
      esc(err.message) +
      '</div>';

  }finally{

    box.classList.remove(
      "loading"
    );

  }

}



/* =========================================
   DELETE MATERIAL
========================================= */

async function deleteMaterial(id){

  if(
    !confirm(
      "क्या आप यह material delete करना चाहते हैं?"
    )
  ){

    return;

  }


  try{

    const {
      response,
      data
    } = await jsonFetch(
      "/api/materials/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );


    if(!response.ok){

      alert(
        data.error ||
        "Delete failed."
      );

      return;

    }


    await loadMaterials();


  }catch(err){

    alert(
      "Delete error: " +
      err.message
    );

  }

}



/* =========================================
   HTML ESCAPE
========================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"

    }[m])
  );

}



/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
