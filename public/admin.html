<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sir Mahee Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><nav><b>🔐 Sir Mahee Admin</b><a href="/">Student Website</a></nav>
<main class="admin">
<section id="login" class="glass panel"><h1>Admin Login</h1><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="msg"></p></section>
<section id="dash" style="display:none"><div class="glass panel"><div class="row"><div><h1>📤 Content Manager</h1><p>Upload and manage your study material.</p></div><button class="btn" onclick="logout()">Logout</button></div>
<form id="form" enctype="multipart/form-data"><div class="two"><label>Title<input name="title" required placeholder="Tenses — Complete Notes"></label><label>Class<select name="className"><option>All Classes</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>Subject<select name="subject"><option>English</option><option>Hindi</option><option>Maths</option><option>Science</option><option>Social Science</option><option>Rajasthan GK</option><option>Competitive Exams</option><option>Other</option></select></label><label>Type<select name="type"><option>Notes</option><option>PDF</option><option>Worksheet</option><option>Question Paper</option><option>Video</option><option>Audio</option><option>Image</option><option>Other</option></select></label><label>Chapter<input name="chapter" placeholder="Grammar / Tenses"></label><label>Description<textarea name="description" placeholder="Short description"></textarea></label></div><label>File<input name="file" type="file" required></label><button class="btn" type="submit">Upload Material</button><p id="upmsg"></p></form></div>
<div class="glass panel"><h2>📚 Uploaded Materials</h2><div id="items"></div></div></section></main>
<script>
async function me(){let x=await fetch("/api/me").then(r=>r.json());if(x.loggedIn){login.style.display="none";dash.style.display="block";load()}}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});if(r.ok){login.style.display="none";dash.style.display="block";load()}else msg.textContent=(await r.json()).error}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
form.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/materials",{method:"POST",body:new FormData(form)});upmsg.textContent=r.ok?"Uploaded ✓":"Upload failed";if(r.ok){form.reset();load()}}
async function load(){let a=await fetch("/api/materials").then(r=>r.json());items.innerHTML=a.map(x=>`<div class="item glass"><b>${esc(x.title)}</b><span>${esc(x.subject)} • Class ${esc(x.class_name)} • ${esc(x.type)}</span><a href="/uploads/${encodeURIComponent(x.stored_name)}" target="_blank">Open</a><button onclick="del(${x.id})">Delete</button></div>`).join("")||"<p>No materials yet.</p>"}
async function del(id){if(confirm("Delete this material?")){await fetch("/api/materials/"+id,{method:"DELETE"});load()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}me();
</script></body></html>
